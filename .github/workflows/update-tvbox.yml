name: Update TVBox configuration

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 02:00 运行一次

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run check_sources
        run: |
          python3 scripts/check_sources.py
      - name: Generate tvbox.json
        run: |
          python3 scripts/generate_config.py
      - name: Validate tvbox.json
        run: |
          python3 scripts/validate_config.py
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvbox.json reports/source-health.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update tvbox.json and reports" || true
            git push
          else
            echo "No changes to commit"
          fi
